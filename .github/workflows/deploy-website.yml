name: Deploy website

# Builds website/ and uploads it to Cloudflare Pages (https://zipcodes.bluehive.com).
#
# Runs when a release is published, so the site always documents the version that
# was just released. It can also be run by hand from the Actions tab, for example
# after a docs-only change on master.
#
# Requires two repository secrets:
#   CLOUDFLARE_ACCOUNT_ID  the account that owns the Pages project
#   CLOUDFLARE_API_TOKEN   an API token with the "Cloudflare Pages: Edit" permission

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: deploy-website
  cancel-in-progress: false

permissions:
  contents: read

env:
  PAGES_PROJECT: bluehive-zipcodes

jobs:
  deploy:
    # Pre-releases publish to the `next` dist-tag; they don't update the public docs.
    # Like publish.yml, treat a hyphenated tag (v9.1.0-beta.1) as a pre-release even
    # when the release's pre-release box wasn't ticked.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (!github.event.release.prerelease && !contains(github.event.release.tag_name, '-'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      # On a release this is the release's tag; on a manual run, the chosen branch or tag.
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      # package.json on the tag can lag behind the release (the tag decides the
      # published version), so tell the site which version it is documenting.
      - name: Resolve the version to show on the site
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            echo "SITE_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
          fi

      - name: Generate the dataset module
        run: node scripts/generate-data.mjs

      - name: Install website dependencies
        working-directory: website
        run: npm ci --no-audit --no-fund

      - name: Build
        working-directory: website
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Pinned to the version this command was verified with. Newer Wrangler
          # releases are moving Pages commands over to Workers.
          wranglerVersion: '4.167.0'
          # --branch=main marks this as the production deployment of the Pages project.
          command: pages deploy website/dist --project-name=${{ env.PAGES_PROJECT }} --branch=main --commit-dirty=true

name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      # No lockfile is committed for the library (package-lock.json is gitignored).
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test

      # The library supports Node 18 and 20, but the test tooling needs Node 22.
      # Check that the build itself loads and works on it.
      - name: Pack the build
        if: matrix.node == '24'
        run: npm pack --ignore-scripts
      - uses: actions/setup-node@v7
        if: matrix.node == '24'
        with:
          node-version: '18'
          package-manager-cache: false
      - name: Smoke test the packed build on Node 18
        if: matrix.node == '24'
        run: |
          mkdir "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "$GITHUB_WORKSPACE"/*.tgz
          node -e "const z = require('@bluehive-health/zipcodes'); if (z.lookup('90210').city !== 'Beverly Hills') process.exit(1)"
          node --input-type=module -e "import { distance } from '@bluehive-health/zipcodes'; if (distance('62959', '90210') !== 1662) process.exit(1)"

  website:
    name: Build website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node scripts/generate-data.mjs
      - run: npm ci --no-audit --no-fund
        working-directory: website
      - run: npm run build
        working-directory: website

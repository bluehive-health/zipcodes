name: Publish package

# The release tag is the source of truth for the published version.
# Publishing release `v1.2.3` (or `1.2.3`) publishes version 1.2.3, regardless of
# the version currently committed in package.json, to both registries:
#   - GitHub Packages: @bluehive-health/zipcodes (the name in package.json)
#   - npmjs.com:       @bluehive/zipcodes (staged: a maintainer must approve it on npmjs)
# A registry that already has the version is skipped, so a failed run can be retried.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to publish (e.g. v8.0.8). Set "Use workflow from" to this same tag.'
        required: true
        type: string

concurrency:
  group: publish-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the version-bump branch
      packages: write # publish to npm.pkg.github.com
      pull-requests: write # open the version-bump PR
      id-token: write # npm trusted publishing (OIDC) and provenance
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      NPMJS_NAME: '@bluehive/zipcodes'
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com/'
          scope: '@bluehive-health'
          # Never restore a dependency cache in the release job (cache-poisoning risk).
          package-manager-cache: false

      # Uses the semver package bundled with npm for strict SemVer validation.
      - name: Resolve version from tag
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          SEMVER="$(npm root -g)/npm/node_modules/semver"
          VERSION=$(node -e 'const s = require(process.argv[1]); process.stdout.write(s.valid(process.argv[2]) || "")' "$SEMVER" "$TAG")
          if [[ -z "$VERSION" ]]; then
            echo "::error::Tag '$TAG' is not a valid SemVer version (expected vX.Y.Z or X.Y.Z)."
            exit 1
          fi
          # Manual runs have no release payload, so read the release's pre-release flag from GitHub.
          if [[ "$EVENT_NAME" == "release" ]]; then
            PRERELEASE="$RELEASE_PRERELEASE"
          elif ! PRERELEASE=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease); then
            echo "::error::No GitHub release found for tag '$TAG'."
            exit 1
          fi
          if [[ "$PRERELEASE" == "true" || "$VERSION" == *-* ]]; then
            DIST_TAG=next
          else
            DIST_TAG=latest
          fi
          {
            echo "version=$VERSION"
            echo "dist_tag=$DIST_TAG"
            echo "semver=$SEMVER"
          } >> "$GITHUB_OUTPUT"
          echo "Publishing version $VERSION with dist-tag '$DIST_TAG' (from tag '$TAG')"

      - name: Checkout tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}

      # npm provenance attests the run's commit (GITHUB_SHA), not what we checked
      # out. Refuse to publish unless they match, so the attestation always points
      # at the release's own commit. Manual runs must use "Use workflow from: <tag>".
      - name: Ensure the run's commit is the tag's commit
        run: |
          TAG_SHA=$(git rev-parse HEAD)
          if [[ "$TAG_SHA" != "$GITHUB_SHA" ]]; then
            echo "::error::Tag '$TAG' is $TAG_SHA, but this run is for $GITHUB_SHA ($GITHUB_REF). Provenance would point at the wrong commit. Re-run with 'Use workflow from' set to tag '$TAG', or cut a new release."
            exit 1
          fi

      # npmjs gets its own npm config so the GitHub Packages registry/auth from
      # setup-node never applies to it. Auth is npm trusted publishing (OIDC),
      # configured on npmjs to allow `npm stage publish` only.
      - name: Write npmjs config
        run: |
          NPMRC="$RUNNER_TEMP/npmjs.npmrc"
          printf '%s\n' "registry=https://registry.npmjs.org/" "@bluehive:registry=https://registry.npmjs.org/" > "$NPMRC"
          echo "NPMJS_USERCONFIG=$NPMRC" >> "$GITHUB_ENV"

      - name: Check which registries already have this version
        id: existing
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          GH_NAME=$(node -p "require('./package.json').name")
          published() { npm view "$1@$VERSION" version 2>/dev/null | grep -qx "$VERSION"; }
          GITHUB=false; NPMJS=false
          if published "$GH_NAME"; then GITHUB=true; fi
          if NPM_CONFIG_USERCONFIG="$NPMJS_USERCONFIG" published "$NPMJS_NAME"; then NPMJS=true; fi
          echo "GitHub Packages ($GH_NAME@$VERSION): already published=$GITHUB"
          echo "npmjs ($NPMJS_NAME@$VERSION): already published=$NPMJS"
          if [[ "$GITHUB" == "true" && "$NPMJS" == "true" ]]; then
            echo "::error::$VERSION is already published to both registries. Bump the version and cut a new release (e.g. a higher patch number)."
            exit 1
          fi
          echo "github=$GITHUB" >> "$GITHUB_OUTPUT"
          echo "npmjs=$NPMJS" >> "$GITHUB_OUTPUT"

      - name: Set package version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      # No lockfile is committed (package-lock.json is gitignored), so `npm ci` is not an option.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Test
        run: npm test

      - name: Publish to GitHub Packages
        if: steps.existing.outputs.github != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIST_TAG: ${{ steps.version.outputs.dist_tag }}
        run: npm publish --tag "$DIST_TAG"

      # Same tarball contents, under the npmjs name. publishConfig is removed
      # because it pins the registry to GitHub Packages. The trusted publisher
      # only allows staging: the version goes live once a maintainer approves it.
      - name: Stage on npmjs
        if: steps.existing.outputs.npmjs != 'true'
        env:
          DIST_TAG: ${{ steps.version.outputs.dist_tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -o pipefail # so a failed stage publish isn't masked by tee
          npm pkg set name="$NPMJS_NAME"
          npm pkg delete publishConfig
          NPM_CONFIG_USERCONFIG="$NPMJS_USERCONFIG" npm stage publish --access public --provenance --tag "$DIST_TAG" 2>&1 | tee "$RUNNER_TEMP/stage.log"
          {
            echo "### npmjs: $NPMJS_NAME@$VERSION is staged and waiting for approval"
            echo
            echo "A maintainer must approve it before it is published (requires 2FA):"
            echo
            echo "- on npmjs.com: https://www.npmjs.com/package/$NPMJS_NAME (staged versions), or"
            echo "- from a terminal: \`npm stage list $NPMJS_NAME\`, then \`npm stage approve <stage-id>\`"
            echo
            echo '```'
            cat "$RUNNER_TEMP/stage.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=npmjs approval needed::$NPMJS_NAME@$VERSION is staged on npmjs. Approve it with 'npm stage approve' or on npmjs.com."

      # master is protected, so instead of pushing directly we open a PR that
      # syncs package.json with what was just published. Best effort: a failure
      # here does not undo or fail the publish.
      - name: Open PR to sync package.json version
        if: steps.version.outputs.dist_tag == 'latest'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'master' }}
          SEMVER: ${{ steps.version.outputs.semver }}
        run: |
          BRANCH="chore/bump-version-$VERSION"
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          # --force discards the publish-time package.json edit so we read the branch's real version.
          git checkout --force -B "$BRANCH" "origin/$DEFAULT_BRANCH"
          CURRENT=$(node -p "require('./package.json').version")
          CMP=$(node -e 'const s = require(process.argv[1]); process.stdout.write(String(s.compare(process.argv[2], process.argv[3])))' "$SEMVER" "$VERSION" "$CURRENT")
          if [[ "$CMP" == "0" ]]; then
            echo "package.json on $DEFAULT_BRANCH is already $VERSION; nothing to sync."
            exit 0
          fi
          if [[ "$CMP" == "-1" ]]; then
            echo "package.json on $DEFAULT_BRANCH ($CURRENT) is newer than $VERSION; not downgrading."
            exit 0
          fi
          npm version "$VERSION" --no-git-tag-version
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: bump version to $VERSION"
          git push --force origin "$BRANCH"
          if [[ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]]; then
            gh pr create --base "$DEFAULT_BRANCH" --head "$BRANCH" \
              --title "chore: bump version to $VERSION" \
              --body "Syncs \`package.json\` with \`@bluehive-health/zipcodes@$VERSION\`, published from release \`$TAG\`."
          fi
